# Acoes suportadas:
#   fill              — preenche um input (seletor + valor)
#   clear             — limpa um input    (seletor)
#   click             — clica num elemento (seletor)
#   click_if_exists   — clica se existir, ignora se nao (seletor, timeout?)
#   press             — pressiona tecla (tecla, seletor opcional)
#   type_keys         — digita via teclado global, sem seletor (valor, delay_tecla?)
#   wait              — pausa fixa em ms (ms: 500) — usar apenas se necessario
#   wait_for_selector — aguarda elemento aparecer (seletor)
#   wait_for_navigation — aguarda carregamento da pagina (estado?)
#   check_success     — valida texto de retorno (seletor, texto_esperado?)
#   fail_if_visible   — falha SE o seletor aparecer — usa para detectar erros
#                       (seletor, timeout?, mensagem?)
#   screenshot        — tira screenshot (nome?)


site_receber:
  url: "https://arco.loggi.com/"

site_despacho:
  url: "https://xd-app.loggi.com/login"

comportamento:
  delay_entre_acoes: 0      # sem delay artificial — o site valida na propria pagina
  timeout_elemento:  15     # segundos aguardando seletores aparecerem
  headless:          false


# ── Login automatico (opcional) ───────────────────────────────────────────────
# Executado logo apos abrir o browser, ANTES do operador clicar "Pronto para Bipar".
# Requer usuario e senha salvos em Configuracoes > Credenciais.
# Se as credenciais nao estiverem salvas, estes fluxos sao IGNORADOS automaticamente.
# As variaveis {{usuario}} e {{senha}} sao injetadas pelo sistema em tempo de execucao.
#
# Ajuste os seletores abaixo se o site usar campos diferentes.
# O seletor padrao "input[type='email']" funciona na maioria dos logins Cognito/Loggi.

fluxo_login_arco:
  - acao: fill
    seletor: "[data-testid='emailInput']"
    valor: "{{usuario}}"
  - acao: fill
    seletor: "[data-testid='passwordInput']"
    valor: "{{senha}}"
  - acao: press
    seletor: "[data-testid='passwordInput']"
    tecla: "Enter"
  - acao: wait_for_navigation
    estado: domcontentloaded

fluxo_login_xd:
  - acao: fill
    seletor: "[name='email']"
    valor: "{{usuario}}"
  - acao: fill
    seletor: "[name='password']"
    valor: "{{senha}}"
  - acao: press
    seletor: "[name='password']"
    tecla: "Enter"
  - acao: wait_for_navigation
    estado: domcontentloaded


fluxo_entrada_pacote:
  - acao: fill
    seletor: "input[placeholder*='Bipe para receber pacotes e sacas']"
    valor: "{{codigo}}"
  - acao: press
    seletor: "input[placeholder*='Bipe para receber pacotes e sacas']"
    tecla: "Enter"
  - acao: check_success
    seletor: "[role='alert']:has-text('{{codigo}}')"
    texto_esperado: "bipada"
    mensagem: "Arco nao confirmou o recebimento do pacote"


fluxo_despacho_codigo:
  # 2. pequena pausa para a pagina estabilizar apos o clique
  - acao: wait
    ms: 50

  # 1. garante foco na pagina
  - acao: click
    seletor: "body"

  # 2. digita o codigo via teclado global (simula scanner fisico)
  - acao: type_keys
    valor: "{{codigo}}"
    delay_tecla: 10

  # 3. confirma
  - acao: press
    tecla: "Enter"

  # 4. detecta erro — aguarda ate 2500ms pelo alerta de erro do XD
  #    O XD faz chamada de API antes de exibir o erro; 500ms era insuficiente.
  #    Aumente se ainda perder erros; reduza se o despacho estiver lento demais.
  - acao: fail_if_visible
    seletor: "[class*='MuiAlert-message']"
    timeout: 2500
    mensagem: "Falha no despacho — verifique o codigo"


    # text


fluxo_validar_recepcao:
  - acao: check_url_contains
    valor: "BN7"
    mensagem: "A URL do navegador nao contem 'BN7'.\nVoce esta na base correta para recebimento?"